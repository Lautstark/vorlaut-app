org.gradle.configuration-cache=true
org.gradle.caching=true
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official

# The exchange spec pin. Empty on purpose: see docs/exchange-pin.md.
# The conformance suite fails loudly while this is unset, rather than skipping.
exchange.sha=6faae3df408e87fffd23ed5bc7355475215ba135

# The release signing certificate, as its SHA-256 fingerprint. An Android app's
# identity is its signing key: a device only accepts an update signed by the same
# one, and refuses anything else outright rather than warning. So which key is the
# right key is a fact this repository records, not something only the keystore
# knows - and the release job checks the APK against it before publishing.
#
# Empty until the first keystore exists, and the release fails with instructions
# while it is, for the same reason the exchange pin does: a check that quietly
# passes when its input is missing is worse than no check. See docs/releasing.md.
release.certificateSha256=EE:93:6B:7C:9F:91:F9:63:2B:CD:A9:0B:1A:DE:60:27:61:9B:9B:E2:60:C1:57:2A:39:11:45:8D:F0:FA:52:BC
