name: CI

# Build, unit tests and lint on every pull request.
#
# The trigger is unconditional and there are no `paths:` filters, so every job
# reports a conclusion on every pull request and can therefore be marked as a
# required status check. A workflow skipped by a `paths:` filter never reports at
# all: its checks sit pending forever and a pull request that requires them can
# never merge.
#
# The trigger covers every branch, not just main and pull requests. This
# repository is trunk-based and does not use pull requests: work happens on a
# branch, is merged locally with --no-ff, and main is pushed. A workflow that
# only fired on `pull_request` and `push: [main]` would therefore never run
# before a merge — "push the branch and wait for green" would wait forever, and
# the first CI run of any change would be the one after it had already landed.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]
  # Releasing without reaching for a terminal. Same job, same gate: the three
  # verification jobs still have to pass before it publishes anything, and the tag
  # still ends up existing - `gh release create` creates it at the commit being
  # built, so a release made this way is indistinguishable afterwards from one
  # made by pushing a tag.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v - for example 0.2.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The parser suite, split from the Android build so it runs on its own runner
  # and reports on its own. It needs no Android SDK and no emulator, which is the
  # whole reason :boardpackage is a plain JVM module - this job is seconds, and it
  # is the one that says whether the importer is conformant.
  parser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run parser unit tests
        run: ./gradlew :boardpackage:check
      - name: Upload parser test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-test-reports
          path: boardpackage/build/reports/tests/

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Assemble debug build
        run: ./gradlew :app:assembleDebug
      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew :app:lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: app/build/reports/

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Check formatting
        run: ./gradlew spotlessCheck

  # Leaves a signed, installable APK behind on every push to main, as a build
  # artifact rather than a release. Releases are for families; this is for whoever
  # needs to put the current main on a tablet and try it, without cutting a version
  # to do it.
  #
  # It is signed with the release key rather than the debug one on purpose. A
  # debug-signed APK cannot be installed over a real release or updated from one,
  # so the person most likely to want a snapshot - a tester who already has v0.1.0
  # on the tablet - is exactly the person it would not work for.
  #
  # versionCode stays at whatever the latest tag packs to, so a snapshot installs
  # over that release and a later release installs over the snapshot. Snapshots are
  # therefore not ordered against each other: they are for trying main, not for
  # running a fleet on.
  snapshot:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [parser, android, format]
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Tags are needed to work out which release this snapshot sits on top of.
          fetch-depth: 0
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      - name: Derive a snapshot version
        id: version
        run: |
          set -euo pipefail
          latest="$(git describe --tags --abbrev=0 --match 'v[0-9]*.[0-9]*.[0-9]*' 2>/dev/null || echo v0.0.0)"
          version="${latest#v}"
          IFS=. read -r major minor patch <<<"$version"
          echo "name=$version-dev.${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"

      - name: Build a signed APK
        id: apk
        uses: ./.github/actions/build-signed-apk
        with:
          version-name: ${{ steps.version.outputs.name }}
          version-code: ${{ steps.version.outputs.code }}
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Upload the snapshot
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: vorlaut-main-${{ steps.version.outputs.short }}
          path: ${{ steps.apk.outputs.apk }}
          # Long enough to be useful to whoever asks for "the current one", short
          # enough that unreleased builds do not accumulate indefinitely.
          retention-days: 14

  # Publishes a signed APK to a GitHub Release. Either a v* tag was pushed, or
  # somebody ran this workflow from the Actions tab and gave it a version.
  #
  # `needs:` is what makes this "green, then publish" rather than a convention:
  # the job cannot start until the parser suite, the Android build and the format
  # check have all succeeded on the same commit, and a failure in any of them
  # leaves the tag with no release rather than with an untested binary. That holds
  # for the button too - it is a different way to ask for a release, not a way
  # around the gate.
  #
  # `contents: write` is granted here and nowhere else. The workflow's own
  # permission block stays read-only, so the verification jobs - the ones that run
  # project code and third-party Gradle plugins - cannot write to the repository
  # even if something in the build tries to.
  #
  # The upload uses the pre-installed `gh` CLI rather than a release action. This
  # is the one job that holds the signing key and can write to the repository, and
  # every action it runs is another party with access to that; `gh release create`
  # is one fewer.
  #
  # Unlike the verification jobs, this one is not a candidate for a required status
  # check: the `if:` skips it on every push that is not a tag, and a required check
  # that is usually skipped tells you nothing about the change in front of you.
  release:
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    needs: [parser, android, format]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The version comes from the tag, or from what was typed into the button, and
      # is checked the same way either way - a typo in a form field is at least as
      # likely as a mistyped tag. versionName is the version; versionCode is packed
      # from the same three numbers, so it rises with the version and never has to
      # be remembered separately. That packing holds while minor and patch stay
      # below 100 - if this project ever cuts 0.100.0, this is the line to revisit.
      - name: Derive the version
        id: version
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            version='${{ inputs.version }}'
            source="the version given to this workflow"
          else
            version="${GITHUB_REF_NAME#v}"
            source="tag ${GITHUB_REF_NAME}"
          fi
          version="$(printf '%s' "$version" | tr -d '[:space:]')"
          version="${version#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$version' ($source) is not MAJOR.MINOR.PATCH, so no version can be derived from it."
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      # Checked before the build rather than after it, so a version that is already
      # out fails in seconds instead of after a full release build. gh release
      # create would refuse anyway; this only makes it say so sooner, and say why.
      - name: Refuse to republish a version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${{ steps.version.outputs.tag }}" >/dev/null 2>&1; then
            echo "::error::${{ steps.version.outputs.tag }} has already been released. A published release is not overwritten - delete the release and its tag first, or pick the next version. See docs/releasing.md."
            exit 1
          fi

      - name: Build a signed APK
        id: apk
        uses: ./.github/actions/build-signed-apk
        with:
          version-name: ${{ steps.version.outputs.name }}
          version-code: ${{ steps.version.outputs.code }}
          keystore-base64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          keystore-password: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          key-alias: ${{ secrets.RELEASE_KEY_ALIAS }}
          key-password: ${{ secrets.RELEASE_KEY_PASSWORD }}

      - name: Name the artifact after its version
        id: artifact
        run: |
          set -euo pipefail
          apk="vorlaut-${{ steps.version.outputs.name }}.apk"
          cp "${{ steps.apk.outputs.apk }}" "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      # An APK downloaded from a release page is sideloaded, so the checksum goes up
      # beside it: it is the only way someone installing this outside a store can
      # tell that what they fetched is what this run built.
      #
      # --target names the commit explicitly. On a tag push it is the tag's own
      # commit and changes nothing; from the button there is no tag yet, and this is
      # what creates it at the commit that was actually built and verified.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ steps.artifact.outputs.apk }}" \
            "${{ steps.artifact.outputs.apk }}.sha256" \
            --target "$GITHUB_SHA" \
            --title "vorlaut ${{ steps.version.outputs.name }}" \
            --generate-notes
