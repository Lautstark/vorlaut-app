name: CI

# Build, unit tests and lint on every pull request.
#
# The trigger is unconditional and there are no `paths:` filters, so every job
# reports a conclusion on every pull request and can therefore be marked as a
# required status check. A workflow skipped by a `paths:` filter never reports at
# all: its checks sit pending forever and a pull request that requires them can
# never merge.
#
# The trigger covers every branch, not just main and pull requests. This
# repository is trunk-based and does not use pull requests: work happens on a
# branch, is merged locally with --no-ff, and main is pushed. A workflow that
# only fired on `pull_request` and `push: [main]` would therefore never run
# before a merge — "push the branch and wait for green" would wait forever, and
# the first CI run of any change would be the one after it had already landed.
on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The parser suite, split from the Android build so it runs on its own runner
  # and reports on its own. It needs no Android SDK and no emulator, which is the
  # whole reason :boardpackage is a plain JVM module - this job is seconds, and it
  # is the one that says whether the importer is conformant.
  parser:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Run parser unit tests
        run: ./gradlew :boardpackage:check
      - name: Upload parser test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: parser-test-reports
          path: boardpackage/build/reports/tests/

  android:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Assemble debug build
        run: ./gradlew :app:assembleDebug
      - name: Run app unit tests
        run: ./gradlew :app:testDebugUnitTest
      - name: Run Android lint
        run: ./gradlew :app:lintDebug
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-lint-report
          path: app/build/reports/

  format:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
      - name: Check formatting
        run: ./gradlew spotlessCheck

  # Publishes a signed APK to a GitHub Release, and only ever for a v* tag.
  #
  # `needs:` is what makes this "green, then publish" rather than a convention:
  # the job cannot start until the parser suite, the Android build and the format
  # check have all succeeded on the same commit, and a failure in any of them
  # leaves the tag with no release rather than with an untested binary.
  #
  # `contents: write` is granted here and nowhere else. The workflow's own
  # permission block stays read-only, so the three verification jobs - the ones
  # that run project code and third-party Gradle plugins - cannot write to the
  # repository even if something in the build tries to.
  #
  # The upload uses the pre-installed `gh` CLI rather than a release action. This
  # is the one job that holds the signing key, and every action it runs is another
  # party with access to that runner; `gh release create` is one fewer.
  #
  # Unlike the three above, this job is not a candidate for a required status
  # check: the `if:` skips it on every push that is not a tag, and a required
  # check that is usually skipped tells you nothing about the change in front of
  # you. The verification jobs are the ones to require.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [parser, android, format]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install JDK
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0

      # The tag is the only place a version is written down. versionName is the
      # tag without its v; versionCode is packed from the same three numbers, so
      # it rises with the version and never has to be remembered separately. That
      # packing holds while minor and patch stay below 100, which the tag shape
      # check below does not enforce - if this project ever cuts 0.100.0, this is
      # the line to revisit.
      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if ! printf '%s' "$version" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not vMAJOR.MINOR.PATCH, so no version can be derived from it."
            exit 1
          fi
          IFS=. read -r major minor patch <<<"$version"
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$(( major * 10000 + minor * 100 + patch ))" >> "$GITHUB_OUTPUT"

      - name: Restore signing keystore
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${RELEASE_KEYSTORE_BASE64:-}" ]; then
            echo "::error::The RELEASE_KEYSTORE_BASE64 secret is unset, so this release could only be unsigned. See docs/releasing.md."
            exit 1
          fi
          # Whitespace is stripped before decoding. Different base64 tools wrap
          # their output at different widths and a pasted secret can pick up a
          # stray newline, which would arrive here as a keystore that is merely
          # corrupt - the least legible way for this to fail.
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "$RUNNER_TEMP/release.jks"
          if [ ! -s "$RUNNER_TEMP/release.jks" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 did not decode to anything. Re-encode the keystore and set the secret again; see docs/releasing.md."
            exit 1
          fi

      - name: Assemble signed release APK
        env:
          RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease \
            -Prelease.versionCode=${{ steps.version.outputs.code }} \
            -Prelease.versionName=${{ steps.version.outputs.name }}

      # The build is not asked whether it signed the APK - the APK is. A missing
      # or wrong secret, a bad alias and a corrupt keystore all end in the same
      # place, an artifact that installs nowhere, and only the artifact itself can
      # rule all of them out. The certificate is printed so the log records which
      # key a given release went out under.
      #
      # An unsigned build does not merely fail this check, it never reaches it:
      # AGP writes app-release-unsigned.apk under that name instead, so the path
      # below is absent. Both endings stop the job, and the explicit test is here
      # so the log says which one happened.
      - name: Verify the APK is signed
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::No $apk. The build produced $(ls app/build/outputs/apk/release/*.apk 2>/dev/null || echo 'no APK at all'), which means it did not sign anything. Check the signing secrets against docs/releasing.md."
            exit 1
          fi
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          apksigner="$(find "$sdk/build-tools" -name apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -z "$apksigner" ]; then
            echo "::error::No apksigner found under '$sdk/build-tools', so the signature cannot be verified. Refusing to publish an APK nobody has checked."
            exit 1
          fi
          "$apksigner" verify --verbose --print-certs "$apk"

          # Signed is necessary but not sufficient: signed with *the same key as
          # last time* is the property that matters. A device accepts an update
          # only from the key that installed the app and refuses any other one
          # outright, so a swapped keystore does not degrade anything - it strands
          # everyone who already has the app on an install they cannot update and
          # can only replace, losing its data. Nothing about such a build looks
          # wrong: it compiles, it signs, it verifies. The pin is what tells the
          # two apart, and it is checked here, before anything is published.
          expected="$(sed -n 's/^release\.certificateSha256=//p' gradle.properties | tr -d ' \r' | tr '[:upper:]' '[:lower:]' | tr -d ':')"
          actual="$("$apksigner" verify --print-certs "$apk" | sed -n 's/.*certificate SHA-256 digest: *//p' | head -n 1 | tr -d ' \r' | tr '[:upper:]' '[:lower:]' | tr -d ':')"

          if [ -z "$expected" ]; then
            echo "::error::release.certificateSha256 is unset in gradle.properties, so there is nothing to check this key against. This APK was signed with $actual - if that is the release key, put it there and tag again. See docs/releasing.md."
            exit 1
          fi
          if [ "$expected" != "$actual" ]; then
            echo "::error::Wrong signing key. gradle.properties pins $expected, this APK is signed with $actual. Publishing it would strand every device that already has the app on an update it must refuse. Either the RELEASE_KEYSTORE_BASE64 secret is not the release keystore, or the key changed deliberately - see docs/releasing.md before touching the pin."
            exit 1
          fi
          echo "Signing key matches the pin ($expected)."

      - name: Name the artifact after its version
        id: artifact
        run: |
          set -euo pipefail
          apk="vorlaut-${{ steps.version.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "apk=$apk" >> "$GITHUB_OUTPUT"

      # An APK downloaded from a release page is sideloaded, so the checksum goes
      # up beside it: it is the only way someone installing this outside a store
      # can tell that what they fetched is what this run built.
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            "${{ steps.artifact.outputs.apk }}" \
            "${{ steps.artifact.outputs.apk }}.sha256" \
            --title "vorlaut ${{ steps.version.outputs.name }}" \
            --generate-notes
